services:
  - type: web
    name: ai-connector-plus
    env: python
    plan: free
    region: singapore  
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ENV
        value: production
